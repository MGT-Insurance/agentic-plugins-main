name: promote

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the diffs without pushing to MGT-Insurance/claude-plugins or MGT-Insurance/chatgpt-plugins
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main repository
        uses: actions/checkout@v4
        with:
          path: main

      - name: Check out the Claude production repository
        uses: actions/checkout@v4
        with:
          repository: MGT-Insurance/claude-plugins
          ref: main
          ssh-key: ${{ secrets.PROMOTE_DEPLOY_KEY }}
          path: prod

      - name: Check for the ChatGPT deploy key
        id: chatgpt
        env:
          CHATGPT_KEY: ${{ secrets.CHATGPT_PROMOTE_DEPLOY_KEY }}
        run: |
          if [ -n "${CHATGPT_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the chatgpt-plugins target: the CHATGPT_PROMOTE_DEPLOY_KEY secret is not set. Create MGT-Insurance/chatgpt-plugins, add a write deploy key, and store the private key as that secret to enable it."
          fi

      - name: Check out the ChatGPT production repository
        if: ${{ steps.chatgpt.outputs.enabled == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: MGT-Insurance/chatgpt-plugins
          ref: main
          ssh-key: ${{ secrets.CHATGPT_PROMOTE_DEPLOY_KEY }}
          path: prod-chatgpt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate the claude-plugins tree
        run: node main/promote/promote.mjs main claude-plugins prod

      - name: Generate the chatgpt-plugins tree
        if: ${{ steps.chatgpt.outputs.enabled == 'true' }}
        run: node main/promote/promote.mjs main chatgpt-plugins prod-chatgpt

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      # Only the Claude target is a Claude marketplace, so only it is validated by the Claude CLI.
      - name: Validate the claude-plugins output (strict)
        working-directory: prod
        run: |
          set -euo pipefail
          claude plugin validate --strict .
          for dir in plugins/*/; do
            claude plugin validate --strict "$dir"
          done

      - name: Require a version bump for changed plugins (claude-plugins)
        working-directory: prod
        run: |
          set -euo pipefail
          git add -A
          changed="$(git diff --cached --name-only HEAD)"
          status=0
          for dir in plugins/*/; do
            name="$(basename "$dir")"
            if ! printf '%s\n' "$changed" | grep -q "^plugins/${name}/"; then
              continue
            fi
            manifest="plugins/${name}/.claude-plugin/plugin.json"
            if ! git cat-file -e "HEAD:${manifest}" 2>/dev/null; then
              echo "${name}: new plugin, no version check"
              continue
            fi
            new="$(jq -r .version "$manifest")"
            old="$(git show "HEAD:${manifest}" | jq -r .version)"
            top="$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)"
            if [ "$new" = "$old" ] || [ "$top" != "$new" ]; then
              echo "::error::${name}: version ${new} must be greater than ${old} in production"
              status=1
            else
              echo "${name}: ${old} -> ${new}"
            fi
          done
          exit "$status"

      - name: Require a version bump for changed plugins (chatgpt-plugins)
        if: ${{ steps.chatgpt.outputs.enabled == 'true' }}
        working-directory: prod-chatgpt
        run: |
          set -euo pipefail
          git add -A
          changed="$(git diff --cached --name-only HEAD)"
          status=0
          for dir in chatgpt/*/; do
            name="$(basename "$dir")"
            # chatgpt/<name>-upload/ holds the portal manifests for <name>, so a change there counts as a change to <name>.
            case "$name" in *-upload) continue ;; esac
            if ! printf '%s\n' "$changed" | grep -Eq "^chatgpt/${name}(-upload)?/"; then
              continue
            fi
            manifest="chatgpt/${name}/.codex-plugin/plugin.json"
            if ! git cat-file -e "HEAD:${manifest}" 2>/dev/null; then
              echo "${name}: new plugin, no version check"
              continue
            fi
            new="$(jq -r .version "$manifest")"
            old="$(git show "HEAD:${manifest}" | jq -r .version)"
            top="$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)"
            if [ "$new" = "$old" ] || [ "$top" != "$new" ]; then
              echo "::error::${name}: version ${new} must be greater than ${old} in production"
              status=1
            else
              echo "${name}: ${old} -> ${new}"
            fi
          done
          exit "$status"

      - name: Show the diff against claude-plugins
        id: diff
        working-directory: prod
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes: claude-plugins already matches main."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat HEAD
            git diff --cached HEAD
          fi

      - name: Show the diff against chatgpt-plugins
        id: diff-chatgpt
        if: ${{ steps.chatgpt.outputs.enabled == 'true' }}
        working-directory: prod-chatgpt
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes: chatgpt-plugins already matches main."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat HEAD
            git diff --cached HEAD
          fi

      - name: Commit and push to claude-plugins
        if: ${{ !inputs.dry_run && steps.diff.outputs.changed == 'true' }}
        working-directory: prod
        env:
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Promote from agentic-plugins-main@${MAIN_SHA:0:7}"
          git push origin HEAD:main

      - name: Commit and push to chatgpt-plugins
        if: ${{ !inputs.dry_run && steps.chatgpt.outputs.enabled == 'true' && steps.diff-chatgpt.outputs.changed == 'true' }}
        working-directory: prod-chatgpt
        env:
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Promote from agentic-plugins-main@${MAIN_SHA:0:7}"
          git push origin HEAD:main

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: echo "Dry run, nothing was pushed. Run the workflow again with dry_run off to promote."
