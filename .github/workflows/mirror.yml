name: mirror

# Writes a snapshot of main to the private repository MGT-Insurance/agentic-plugins-main-internal.
# claude.ai organization marketplaces accept only private or internal repositories, so
# the enterprise organization adds the mirror instead of this public repository.
# Each sync is one commit holding this repository's tree without .github/, because GitHub
# refuses deploy-key pushes that touch workflow files. Commit IDs differ from this repository.
# Rulesets on the mirror let only deploy keys write to it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'MGT-Insurance/agentic-plugins-main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Write a snapshot to the private mirror
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "$MIRROR_DEPLOY_KEY" ]; then
            echo "::error::The MIRROR_DEPLOY_KEY secret is not set. Add a write deploy key to MGT-Insurance/agentic-plugins-main-internal and store its private key as this secret."
            exit 1
          fi
          key_file="$RUNNER_TEMP/mirror_key"
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          scripts/sync-mirror.sh "$GITHUB_WORKSPACE" "$(git rev-parse HEAD)" git@github.com:MGT-Insurance/agentic-plugins-main-internal.git
          rm -f "$key_file"
