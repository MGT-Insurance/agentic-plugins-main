name: publish-dev

# Writes the public development repository, MGT-Insurance/agentic-plugins-main, from the private source
# on every push to main. The public repository holds main values and no internal plugins.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-dev
  cancel-in-progress: false

jobs:
  publish-dev:
    # This workflow skips everywhere except the private source repository.
    if: github.repository == 'MGT-Insurance/agentic-plugins-main-internal'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check for the deploy key
        env:
          DEV_PUBLISH_KEY: ${{ secrets.DEV_PUBLISH_DEPLOY_KEY }}
        run: |
          if [ -z "${DEV_PUBLISH_KEY}" ]; then
            echo "::error::The DEV_PUBLISH_DEPLOY_KEY secret is not set. Add a write deploy key to MGT-Insurance/agentic-plugins-main and store its private key as this secret."
            exit 1
          fi

      - name: Check out the public development repository
        uses: actions/checkout@v4
        with:
          repository: MGT-Insurance/agentic-plugins-main
          ref: main
          ssh-key: ${{ secrets.DEV_PUBLISH_DEPLOY_KEY }}
          path: pub

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate the agentic-plugins-main tree
        run: node source/promote/promote.mjs source agentic-plugins-main pub

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Validate the output (strict)
        working-directory: pub
        run: |
          set -euo pipefail
          claude plugin validate --strict .
          for dir in plugins/*/; do
            claude plugin validate --strict "$dir"
          done

      - name: Commit and push when the tree changed
        working-directory: pub
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet HEAD; then
            echo "No changes: agentic-plugins-main already matches the source."
            exit 0
          fi
          git diff --cached --stat HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish from agentic-plugins-main-internal@${SOURCE_SHA:0:7}"
          git push origin HEAD:main
